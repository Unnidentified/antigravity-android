name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to publish (e.g. v1.0.0-alpha.2)'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/antigravity-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-debug-apk
          path: dist/antigravity-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_PRERELEASE=$([[ "$TAG" == *-* ]] && echo "true" || echo "false")
          else
            TAG="${{ inputs.tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          fi

          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="End-to-end native Jetpack Compose & Material 3 build of Antigravity for Android (${TAG}).

          ### Highlights
          - 100% native chat interface (zero browser chrome or visible web UI during normal use) backed by a headless session bridge
          - Native chat menu drawer with New Chat, conversation search, and synced conversations
          - Native prompt input bar with attachments, clickable Model Selector sheet, Quick Prompts, and Send/Stop controls
          - Native Usage & Quota ring indicator and bottom sheet
          - Collapsible & expandable reasoning/thought cards
          - Native Markdown + syntax-highlighted code blocks + native Compose LaTeX math renderer (fractions, roots, scripts, matrices)
          - Settings with System/Dark/AMOLED/Light + Material You themes and 1-tap Sanitized DOM Snapshot exporter for bridge calibration

          Built and verified automatically via GitHub Actions (\`./gradlew testDebugUnitTest assembleDebug\`)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/antigravity-debug.apk --clobber
          else
            gh release create "$TAG" dist/antigravity-debug.apk \
              --target main \
              $PRERELEASE_FLAG \
              --title "Antigravity ${TAG}" \
              --notes "$NOTES"
          fi
